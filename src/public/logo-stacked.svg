<svg width="320" height="140" viewBox="0 0 320 140" fill="none" xmlns="http://www.w3.org/2000/svg">
  <!-- Gradient Definition -->
  <defs>
    <linearGradient id="stackedGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#22c55e;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#38bdf8;stop-opacity:1" />
    </linearGradient>
    
    <!-- Glow Filter -->
    <filter id="stackedGlow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="6" result="coloredBlur"/>
      <feMerge>
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>
  
  <!-- Logo Icon Background - Centered -->
  <rect x="135" y="10" width="50" height="50" rx="12" fill="url(#stackedGradient)" filter="url(#stackedGlow)"/>
  
  <!-- Lightning Bolt Icon -->
  <path d="M163 20L153 37H160L157 50L167 33H160L163 20Z" fill="white" stroke="white" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
  
  <!-- Text: Inspired Energy Optimizer - Centered -->
  <text x="160" y="90" font-family="system-ui, -apple-system, sans-serif" font-size="22" font-weight="600" fill="#f8fafc" text-anchor="middle" letter-spacing="-0.02em">
    Inspired Energy
  </text>
  <text x="160" y="115" font-family="system-ui, -apple-system, sans-serif" font-size="22" font-weight="600" fill="#f8fafc" text-anchor="middle" letter-spacing="-0.02em">
    Optimizer
  </text>
</svg>
